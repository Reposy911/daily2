name: Daily Task Job

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chrome
        run: python -m playwright install chromium
        
      - name: Run registration
        run: |
          mkdir -p exak
          python task_runner.py --count 50 || true

      - name: Upload tokens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exa_account-${{ github.run_number }}-${{ github.run_attempt }}
          path: exak/
          retention-days: 7
          if-no-files-found: ignore

      - name: Notify Telegram
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # 最多发送多少个 JSON 给机器人（避免产出太多导致限流）
          TG_SEND_LIMIT: "10"
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "Telegram secrets not set, skipping notification"
            exit 0
          fi

          COUNT=$(find exak -name '*.json' 2>/dev/null | wc -l)
          if [ "$COUNT" -gt 0 ]; then
            # 有产出时不发送文字消息，直接发送文件
            MSG=""
          else
            MSG="🤖 *Daily Task Job*%0A%0A❌ 本次无产出%0A%0ARun: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi

          if [ "$COUNT" -eq 0 ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT_ID}" \
              -d "text=${MSG}" \
              -d "parse_mode=Markdown" \
              -d "disable_web_page_preview=true" || true
          fi

          # 逐个发送原始 JSON 文件给机器人（不再打 zip）
          if [ "$COUNT" -gt 0 ]; then
            SENT=0
            LIMIT=${TG_SEND_LIMIT:-10}
            for f in exak/*.json; do
              [ -e "$f" ] || continue
              SENT=$((SENT + 1))
              if [ "$SENT" -gt "$LIMIT" ]; then
                echo "Reached TG_SEND_LIMIT=$LIMIT, stop sending more files."
                break
              fi

              BASENAME=$(basename "$f")
              curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
                -F "chat_id=${TG_CHAT_ID}" \
                -F "document=@$f" \
                -F "caption=📄 ${BASENAME} (${SENT}/${COUNT})" || true

              # 轻微延迟避免触发 Telegram 限流
              sleep 1
            done
          fi
